<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ general.fullname }} — {% block title %}CV{% endblock %}</title>
    <meta name="description" content="{{ general.fullname }} · {{ general.headline }}">
    <meta property="og:title" content="{{ general.fullname }} — {{ self.title() }}">
    <meta property="og:description" content="{{ general.headline }}">
    <meta property="og:image" content="assets/portrait.jpg">
    <meta name="theme-color" content="#4472c4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/styles.css?v={{ css_version }}">
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem("theme"); } catch (e) {}
            if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", t);
        })();
        function toggleTheme() {
            var root = document.documentElement;
            var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            try { localStorage.setItem("theme", next); } catch (e) {}
        }
    </script>
</head>
<body>
<nav class="tabs" aria-label="Navigation principale">
    <a href="index.html"{% if active == "cv" %} class="active" aria-current="page"{% endif %}>CV</a>
    <a href="portfolio.html"{% if active == "portfolio" %} class="active" aria-current="page"{% endif %}>Portfolio</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
